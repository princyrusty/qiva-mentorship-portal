# Render Blueprint: one free web service plus one free PostgreSQL database.
# New > Blueprint in the Render dashboard, pick this repository, and apply.
services:
  - type: web
    name: qiva-mentorship
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: qiva-db
          property: connectionString
      # One-time code for creating the owner account at /admin. Read it under Environment in the dashboard.
      - key: ADMIN_SETUP_CODE
        generateValue: true
      - key: CASHFREE_ENV
        value: sandbox
      # Add these later under Environment when you have them (see README):
      # RESEND_API_KEY, EMAIL_FROM, CASHFREE_APP_ID, CASHFREE_SECRET_KEY,
      # GRIEVANCE_OFFICER_NAME, SITE_URL (if you add a custom domain)

databases:
  - name: qiva-db
    plan: free
    region: singapore
    databaseName: qiva
    user: qiva
    ipAllowList: []
